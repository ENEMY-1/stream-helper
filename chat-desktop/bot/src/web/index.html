<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b11">
  <meta name="description" content="Локальная панель чат-бота Stream Helper: статус, команды и автосообщения.">
  <title>Stream Helper · панель бота</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="На главную">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="6" width="16" height="12" rx="4"></rect>
            <path d="M9 11h.01M15 11h.01M9 15c.9.7 2 1 3 1s2.1-.3 3-1"></path>
            <path d="M12 3v2M8 3h8"></path>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Stream Helper</strong>
          <small>chat bot</small>
        </span>
      </a>

      <nav class="nav" aria-label="Разделы панели">
        <a class="nav-item" href="#overview" data-view="overview">
          <span class="nav-icon" data-icon="overview"></span>
          <span class="nav-label">Обзор</span>
        </a>
        <a class="nav-item" href="#commands" data-view="commands">
          <span class="nav-icon" data-icon="commands"></span>
          <span class="nav-label">Команды</span>
          <span class="nav-count" id="nav-commands-count">—</span>
        </a>
        <a class="nav-item" href="#timers" data-view="timers">
          <span class="nav-icon" data-icon="timers"></span>
          <span class="nav-label">Автосообщения</span>
          <span class="nav-count" id="nav-timers-count">—</span>
        </a>
        <a class="nav-item" href="#links" data-view="links">
          <span class="nav-icon" data-icon="links"></span>
          <span class="nav-label">Ссылки</span>
        </a>
        <a class="nav-item" href="#moderation" data-view="moderation">
          <span class="nav-icon" data-icon="lock"></span>
          <span class="nav-label">Модерация</span>
        </a>
        <a class="nav-item" href="#fun" data-view="fun">
          <span class="nav-icon" data-icon="spark"></span>
          <span class="nav-label">Развлечения</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="side-status" id="side-status-card">
        <span class="status-dot" id="side-dot"></span>
        <div class="side-status-text">
          <strong id="side-status-text">Подключение…</strong>
          <span id="side-channel">Twitch</span>
        </div>
      </div>

      <div class="side-note">
        Локальная панель
        <span>127.0.0.1:39001</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="page-eyebrow">Панель управления</p>
          <h1 id="page-title">Обзор</h1>
          <p class="page-sub" id="page-sub">Статус бота и последние сообщения</p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
